<script src="script.js"></script>
<script>
Contenu.pret.then(() => {
/* Les termes sont lus dans contenu/glossaire.md (bloc GLOS-TERMES). L'ordre alphabétique est automatique. */
const termes = Contenu.fiches('GLOS-TERMES').map(f => [f.titre, f.champs['Catégorie'] || '', f.texte, f.brut]);
termes.sort((a, b) => a[0].localeCompare(b[0], 'fr'));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const zone = document.getElementById('glossaire');
const vide = document.getElementById('vide');
function rendre(q = '') {
  const n = norm(q);
  const liste = termes.filter(t => !n || norm(t[0] + ' ' + t[3]).includes(n));
  let lettre = '';
  zone.innerHTML = liste.map(([t, c, d]) => {
    const l = norm(t)[0].toUpperCase();
    const id = l !== lettre ? ` id="lettre-${l}"` : '';
    lettre = l;
    return `<div class="terme"${id}><span class="cat">${Contenu.inline(c)}</span><b>${Contenu.inline(t)}</b><p>${d}</p></div>`;
  }).join('');
  vide.hidden = liste.length > 0;
}
const lettres = [...new Set(termes.map(t => norm(t[0])[0].toUpperCase()))];
document.getElementById('lettres').innerHTML = lettres.map(l => `<a href="#lettre-${l}">${l}</a>`).join('');
document.getElementById('lettres').addEventListener('click', () => { document.getElementById('recherche').value = ''; rendre(); });
document.getElementById('recherche').addEventListener('input', e => rendre(e.target.value));
rendre();
});
</script>
